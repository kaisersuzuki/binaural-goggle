; PlatformIO Project Configuration File
; Binaural Goggle Controller - ESP32 firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_build.filesystem = spiffs

; WebServer, WiFi, ArduinoOTA — all built into ESP32 Arduino framework, no extra deps needed

build_flags =
    -DCORE_DEBUG_LEVEL=3
