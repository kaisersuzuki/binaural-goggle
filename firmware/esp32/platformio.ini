; PlatformIO project - Binaural Goggle WiFi controller
;
; The board carries an ESP32-S3-WROOM-1-N8R8 (U3), not a classic ESP32.
; An image built for "esp32dev" will not flash or boot on it.
;
; There is no serial monitor: the module's only wired UART pads (GPIO43/44,
; header H3) are the link to the dsPIC. Debug output is served at /log.

[env:goggle]
platform = espressif32
board = esp32-s3-devkitc-1          ; ESP32-S3, 8 MB flash (PSRAM unused)
framework = arduino
upload_speed = 460800
build_flags =
    -DCORE_DEBUG_LEVEL=0            ; nothing may print on UART0
    -DARDUINO_USB_CDC_ON_BOOT=0

; Over-the-air upload once the first wired flash is done:
;   join the BinauralGoggle WiFi, then  pio run -e goggle_ota -t upload
[env:goggle_ota]
extends = env:goggle
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=goggle-ota
